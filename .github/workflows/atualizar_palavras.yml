
name: Atualizar Palavras Entretenimento

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Script
        run: python gerar_palavras.py

      - name: Commitar e Atualizar JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add palavras.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto: Atualizacao de palavras da categoria entretenimento"
            git push
          else
            echo "Nenhuma alteracao nas palavras."
          fi
